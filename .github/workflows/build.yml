name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            exe: moqspeak
          - name: macos-arm64
            os: macos-14
            exe: moqspeak
          - name: windows-x86_64
            os: windows-latest
            exe: moqspeak.exe
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: install system libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake nasm libasound2-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev libpipewire-0.3-dev \
            libegl-dev libgbm-dev clang

      - name: install tools (macos)
        if: runner.os == 'macOS'
        run: brew install cmake nasm || true

      - name: install tools (windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress || true
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      # rust-toolchain.toml pins the nightly zgui needs; rustup installs it on first use.
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: test
        run: cargo test -p moqspeak --locked

      - name: build release
        run: cargo build -p moqspeak --release --locked

      - name: package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/moqspeak
          cp target/release/moqspeak README.md LICENSE dist/moqspeak/
          cp client/assets/icons/LICENSE dist/moqspeak/LICENSE-lucide
          cp packaging/icon/moqspeak-512.png dist/moqspeak/moqspeak.png
          cp packaging/linux/moqspeak.desktop dist/moqspeak/
          tar -C dist -czf dist/moqspeak-${{ matrix.name }}.tar.gz moqspeak

      # Signing and notarization run when the Apple secrets are set; otherwise the app is signed
      # ad hoc and Gatekeeper asks the user to approve it on first launch.
      - name: import signing certificate (macos)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: package (macos)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          packaging/macos/bundle.sh target/release/moqspeak
          DMG=dist/moqspeak-${{ matrix.name }}.dmg
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            notarize() {
              xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" \
                --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
            }
            ditto -c -k --keepParent dist/moqspeak.app "$RUNNER_TEMP/app.zip"
            notarize "$RUNNER_TEMP/app.zip"
            xcrun stapler staple dist/moqspeak.app
          fi
          hdiutil create -volname moqspeak -srcfolder dist/moqspeak.app -ov -format UDZO "$DMG"
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_KEY" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
            notarize "$DMG"
            xcrun stapler staple "$DMG"
            rm "$RUNNER_TEMP/AuthKey.p8"
          fi
          (cd dist && ditto -c -k --keepParent moqspeak.app moqspeak-${{ matrix.name }}.zip)

      - name: package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/moqspeak
          cp target/release/moqspeak.exe README.md LICENSE dist/moqspeak/
          cp client/assets/icons/LICENSE dist/moqspeak/LICENSE-lucide
          cd dist && 7z a moqspeak-${{ matrix.name }}.zip moqspeak

      - uses: actions/upload-artifact@v4
        with:
          name: moqspeak-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
