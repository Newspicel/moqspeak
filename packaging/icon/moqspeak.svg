<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- app tile, in the 824 pt grid macOS icons use -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M300 268 H724 A96 96 0 0 1 820 364 V612 A96 96 0 0 1 724 708 H470 L352 800 Q334 812 334 790 V708 H300 A96 96 0 0 1 204 612 V364 A96 96 0 0 1 300 268 Z" fill="#ffffff"/>
  </g>
  <!-- voice bars -->
  <g fill="url(#bars)">
    <rect x="322" y="436" width="56" height="104" rx="28"/>
    <rect x="410" y="372" width="56" height="232" rx="28"/>
    <rect x="498" y="324" width="56" height="328" rx="28"/>
    <rect x="586" y="392" width="56" height="192" rx="28"/>
    <rect x="674" y="448" width="56" height="80" rx="28"/>
  </g>
</svg>
