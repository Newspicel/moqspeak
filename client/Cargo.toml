[package]
name = "moqspeak"
version = "0.1.0"
edition = "2024"
description = "A TeamSpeak-style voice client built on zgui and Media over QUIC"
license = "ISC"
repository = "https://github.com/Newspicel/moqspeak"

[features]
# Offers to share and watch screens.
screen-share = []

[dependencies]
zgui = { git = "https://github.com/zortax/zgui", rev = "ec755561d1f3f012163070c20d860e1cbef1907c" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "ec755561d1f3f012163070c20d860e1cbef1907c" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "ec755561d1f3f012163070c20d860e1cbef1907c" }
zgui-ui-icons = { git = "https://github.com/zortax/zgui", rev = "ec755561d1f3f012163070c20d860e1cbef1907c" }
cpal = "0.18"
opus = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
moq-tokio = "0.19.20"
moq-net = "0.3.8"
bytes = "1"
xcap = "0.9"
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
nnnoiseless = { version = "0.5", default-features = false }
earshot = "1"
sonora = "0.2"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
zgui-ui-primitives = { git = "https://github.com/zortax/zgui", rev = "ec755561d1f3f012163070c20d860e1cbef1907c", version = "0.1.0" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
